name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/Publish-App.ps1
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path artifacts\publish\* -DestinationPath artifacts\CommTestTool-${{ github.ref_name }}-win-x64.zip -Force

      - name: Generate update manifest
        shell: pwsh
        run: |
          $doc = New-Object System.Xml.XmlDocument
          $doc.Load("Directory.Build.props")
          $version = ($doc.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1)
          $build = [long]([DateTime]::UtcNow.ToString("yyyyMMddHHmm"))
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CommTestTool-${{ github.ref_name }}-win-x64.zip"
          powershell -ExecutionPolicy Bypass -File tools/Generate-UpdateManifest.ps1 -Version $version -Build $build -PackagePath "artifacts\CommTestTool-${{ github.ref_name }}-win-x64.zip" -ManifestPath "artifacts\update-manifest.json" -DownloadUrl $downloadUrl -Notes "Release ${{ github.ref_name }}"

      - name: Sign update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "update-signing-ed25519.seed"
          [IO.File]::WriteAllText($keyPath, [Text.Encoding]::ASCII.GetString([Convert]::FromBase64String($env:UPDATE_SIGNING_KEY_BASE64)))
          powershell -ExecutionPolicy Bypass -File tools/Sign-UpdateManifest.ps1 -Manifest artifacts\update-manifest.json -Key $keyPath -Out artifacts\update-manifest.signed.json

      - name: Verify update manifest
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/Verify-UpdateManifest.ps1 -Manifest artifacts\update-manifest.signed.json -PublicKeyBase64 "5Vp7fPpSrbX0KEJMlnRh2YYzIclyim6UQtXYfvll3Dc="

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/CommTestTool-${{ github.ref_name }}-win-x64.zip
            artifacts/update-manifest.signed.json
